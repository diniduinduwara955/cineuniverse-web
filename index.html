<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cine Universe</title>

    <link rel="stylesheet"
          href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>


<body>


<header>

    <div class="logo">
        🎬
    </div>

    <div>

        <h1>Cine Universe</h1>

        <p>
            Movies • TV Series • Entertainment
        </p>

    </div>

</header>



<nav>

    <button onclick="showPage('home')">
        🏠 Home
    </button>

    <button onclick="showPage('movies')">
        🎬 Movies
    </button>

    <button onclick="showPage('series')">
        📺 TV Series
    </button>

</nav>



<main>


<!-- HOME -->

<section id="home"
         class="page active">

    <div class="welcome">

        <h2>
            🎬 Welcome to Cine Universe
        </h2>

        <p>
            Your World of Movies & TV Series 🍿
        </p>

    </div>


    <input
        id="search"
        type="search"
        placeholder="🔎 Search Movies or TV Series..."
    >


    <h2>
        🔥 Popular
    </h2>


    <div id="homeMovies"
         class="movie-grid">

    </div>

</section>



<!-- MOVIES -->

<section id="movies"
         class="page">

    <h2>
        🎬 Movies
    </h2>

    <div id="moviesList"
         class="movie-grid">

    </div>

</section>



<!-- SERIES -->

<section id="series"
         class="page">

    <h2>
        📺 TV Series
    </h2>

    <div id="seriesList"
         class="movie-grid">

    </div>

</section>


</main>



<footer>

    🎬 Cine Universe

    <br>

    🍿 Happy Watching!

</footer>


<div id="detailsModal" class="modal">

    <div class="modal-content">

        <button class="close-btn"
                onclick="closeDetails()">
            ✕
        </button>

        <div id="detailsContent"></div>

    </div>

</div>
<script src="script.js"></script>

</body>

</html>
